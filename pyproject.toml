[project]
name = "march-madness-2026"
version = "0.1.0"
description = "NCAA March Madness prediction model for Kalshi betting"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "rapidfuzz>=3.0",
    "dbt-duckdb>=1.7",
    "sqlfluff>=3.0",
    "kaggle>=1.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingestion", "modeling", "forecasting"]
