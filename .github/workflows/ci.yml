name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync

      - name: Lint SQL
        run: make lint

      - name: Validate Python imports
        run: |
          uv run python -c "from ingestion.utils import get_connection, load_dataframe"
          uv run python -c "from ingestion.ingest_kaggle import main"
          uv run python -c "from ingestion.ingest_kenpom import main"
          uv run python -c "from ingestion.ingest_barttorvik import main"

      - name: Validate dbt project
        run: cd dbt_project && uv run dbt parse
